[build]
  command = "npm run build"
  publish = "dist"

# HTML: always revalidate so fresh deployments are immediately served
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Hashed Vite bundles: immutable 1 year cache
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static self-hosted fonts
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Optimized Meshopt GLB models
[[headers]]
  for = "/models-optimized/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Optimized WebP responsive images
[[headers]]
  for = "/images-optimized/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Original models and images: 7-day cache with background revalidation
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# SPA catch-all rewrite rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

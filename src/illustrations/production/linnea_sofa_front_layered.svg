<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1600" height="900" viewBox="0 0 1600 900" role="img"
     id="sofa-upholstery" data-production="cushion" aria-labelledby="scene04-linnea-title scene04-linnea-desc">
  <title id="scene04-linnea-title">Linnea two-seat sofa — front view</title>
  <desc id="scene04-linnea-desc">Layered editable vector illustration of a beige two-seat sofa with two back cushions, two seat cushions, symmetrical arms and four oak legs.</desc>

  <defs>
    <linearGradient id="scene04-fabricMain" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#E2D3BD"/>
      <stop offset="0.52" stop-color="#CEB99E"/>
      <stop offset="1" stop-color="#BBA486"/>
    </linearGradient>
    <linearGradient id="scene04-fabricLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9DDC9"/>
      <stop offset="1" stop-color="#D0BDA4"/>
    </linearGradient>
    <linearGradient id="scene04-fabricSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B9A58D"/>
      <stop offset="0.5" stop-color="#D2BEA5"/>
      <stop offset="1" stop-color="#B19A80"/>
    </linearGradient>
    <linearGradient id="scene04-oak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9A704B"/>
      <stop offset="0.45" stop-color="#C49A6D"/>
      <stop offset="1" stop-color="#805B3D"/>
    </linearGradient>
    <linearGradient id="scene04-oakFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9A477"/>
      <stop offset="1" stop-color="#936B46"/>
    </linearGradient>
    <filter id="scene04-softShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="scene04-cushionShadow" x="-15%" y="-20%" width="130%" height="150%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <pattern id="scene04-weave" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 2H12 M0 8H12" stroke="#FFFFFF" stroke-opacity=".12" stroke-width=".65"/>
      <path d="M3 0V12 M9 0V12" stroke="#8F7D6C" stroke-opacity=".055" stroke-width=".55"/>
    </pattern>
    <clipPath id="sofa-backrest-wipe" clipPathUnits="userSpaceOnUse"><rect id="sofa-backrest-wipe-rect" x="330" y="180" width="0" height="270" transform="translate(330 0) scale(1.317 1) translate(-330 0)"/></clipPath>
    <clipPath id="sofa-base-wipe" clipPathUnits="userSpaceOnUse"><rect id="sofa-base-wipe-rect" x="250" y="320" width="0" height="320" transform="translate(250 0) scale(1.628 1) translate(-250 0)"/></clipPath>
    <clipPath id="sofa-arm-left-wipe" clipPathUnits="userSpaceOnUse"><rect id="sofa-arm-left-wipe-rect" x="220" y="330" width="0" height="280" transform="translate(220 0) scale(1.3 1) translate(-220 0)"/></clipPath>
    <clipPath id="sofa-arm-right-wipe" clipPathUnits="userSpaceOnUse"><rect id="sofa-arm-right-wipe-rect" x="850" y="330" width="0" height="280" transform="translate(850 0) scale(0.985 1) translate(-850 0)"/></clipPath>
    <clipPath id="sofa-seat-left-wipe" clipPathUnits="userSpaceOnUse"><rect id="sofa-seat-left-wipe-rect" x="339" y="410" width="0" height="170" transform="translate(339 0) scale(1.374 1) translate(-339 0)"/></clipPath>
    <clipPath id="sofa-seat-right-wipe" clipPathUnits="userSpaceOnUse"><rect id="sofa-seat-right-wipe-rect" x="593" y="410" width="0" height="170" transform="translate(593 0) scale(1.449 1) translate(-593 0)"/></clipPath>
    <clipPath id="sofa-back-left-wipe" clipPathUnits="userSpaceOnUse"><rect id="sofa-back-left-wipe-rect" x="357" y="205" width="0" height="245" transform="translate(357 0) scale(1.317 1) translate(-357 0)"/></clipPath>

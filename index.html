<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HEAVEN &amp; CO. — A beautiful way to live.</title>
    <meta name="description" content="HEAVEN &amp; CO. — Furniture · Interiors · Living. Furniture cut, shaped and joined by hand, from forest to home." />
    <meta name="application-name" content="HEAVEN &amp; CO." />
    <meta name="theme-color" content="#F4F1EA" />
    <meta property="og:site_name" content="HEAVEN &amp; CO." />
    <meta property="og:title" content="HEAVEN &amp; CO. — A beautiful way to live." />
    <meta property="og:description" content="Furniture · Interiors · Living" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/fraunces-latin-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fraunces-latin-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face { font-family: Fraunces; font-style: normal; font-weight: 300 500; font-display: swap; src: url('/fonts/fraunces-latin-normal.woff2') format('woff2'); }
      @font-face { font-family: Fraunces; font-style: italic; font-weight: 300 400; font-display: swap; src: url('/fonts/fraunces-latin-italic.woff2') format('woff2'); }
      @font-face { font-family: Inter; font-style: normal; font-weight: 300 500; font-display: swap; src: url('/fonts/inter-latin.woff2') format('woff2'); }
      html, body { min-height: 100%; margin: 0; background: #F4F1EA; }
      #heaven-boot-shell { position: fixed; inset: 0; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #F4F1EA; color: #292923; }
      #heaven-boot-shell .boot-wordmark { display: inline-flex; align-items: baseline; white-space: nowrap; font: 300 clamp(1.5rem, 4vw, 2.25rem)/1 Fraunces, 'Times New Roman', serif; letter-spacing: .26em; }
      #heaven-boot-shell .boot-amp { margin: 0 .12em; font-size: .92em; font-weight: 400; font-style: italic; letter-spacing: 0; }
      #heaven-boot-shell .boot-co { margin-right: -.26em; }
      #heaven-boot-shell .boot-tagline { margin: 1rem 0 0; color: rgb(41 41 35 / .7); font: italic 300 1.125rem/1.4 Fraunces, 'Times New Roman', serif; }
      #heaven-boot-shell .boot-track { width: 10rem; height: 1px; margin-top: 2.5rem; overflow: hidden; background: rgb(41 41 35 / .15); }
      #heaven-boot-shell .boot-fill { width: 0; height: 100%; background: #C96845; }
      #heaven-boot-shell .boot-descriptor { margin: 1rem 0 0; color: rgb(41 41 35 / .45); font: 500 .6rem/1.4 Inter, Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div id="heaven-boot-shell" role="status" aria-live="polite" aria-label="Loading HEAVEN &amp; CO.">
      <span class="boot-wordmark" role="img" aria-label="HEAVEN &amp; CO."><span>HEAVEN</span><span class="boot-amp" aria-hidden="true">&amp;</span><span class="boot-co" aria-hidden="true">CO.</span></span>
      <p class="boot-tagline">A beautiful way to live.</p>
      <div class="boot-track" aria-hidden="true"><div class="boot-fill"></div></div>
      <p class="boot-descriptor">Furniture · Interiors · Living</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
